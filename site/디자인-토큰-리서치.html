th:100%;max-width:290px}.space-row{display:grid;grid-template-columns:80px 1fr 42px;align-items:center;gap:10px;margin:12px 0;font-size:12px}.bar{height:16px;background:#2054c5}.type-sample{width:100%;background:white;padding:20px;color:#1b263b}.type-sample p{margin:0 0 10px}.type-sample .lg{font-size:16px;line-height:24px}.type-sample .md{font-size:14px;line-height:20px}.type-sample .sm{font-size:12px;line-height:16px}.colors{width:100%;background:white;padding:14px}.color-row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}.swatch{width:28px;height:28px;border:1px solid #a6a6a6}.layers{width:100%;background:#dce2ee;padding:20px}.layers div{background:#fff;padding:16px;border:1px solid #b6bfce}.layers div div{background:#eff2f8}.motion-sample{width:100%;max-width:260px}.motion-sample button{background:#183f98;color:white}.dot-track{height:8px;margin-top:25px;background:#d2d8e5}.dot-track span{display:block;width:20px;height:20px;border-radius:50%;background:#315dc1;position:relative;top:-6px}.motion-sample.play .dot-track span{animation:move 250ms ease-out forwards}@keyframes move{to{transform:translateX(180px)}}@media(prefers-reduced-motion:reduce){.motion-sample.play .dot-track span{animation:none;transform:translateX(180px)}}@media(max-width:700px){.entry{grid-template-columns:1fr}.visual{min-height:165px}header,main{padding-left:18px;padding-right:18px}}
</style></head><body><header><strong>DESIGN RESEARCH / VISUAL TOKENS</strong><nav><a href="컴포넌트-카탈로그.html">UI 카탈로그</a><a href="리서치-모션-시안.html">모션 시안</a><a href="안티-디자인-비교.html">안티 디자인</a></nav></header><main><p>근거별 분류 · 조사일 2026.11.03</p><h1>형태를 만드는<br>시각적 결정</h1><p class="lede">사례의 토큰과 적용 조건을 비교하고, 필요한 원칙을 지시문으로 가져갑니다. 값은 해당 디자인 시스템의 예시이며 범용 정답이 아닙니다.</p><p class="note">미리보기는 원문에 기술된 원리를 보여 주기 위해 새로 만든 개념도입니다. 원본 스크린샷이나 정확한 제품 재현이 아닙니다. 출처에서 확인한 값과 미정인 속성을 분리합니다.</p><div class="filters"><label for="topic">분류</label><select id="topic"><option value="">전체</option><option>색상·역할</option><option>간격·레이아웃</option><option>타이포그래피</option><option>컴포넌트·위계</option><option>상태·접근성</option><option>모션</option></select><label for="query">검색</label><input id="query" type="search" placeholder="예: GOV.UK, 간격, focus"><span id="count" aria-live="polite"></span></div><div id="list" class="list"></div><p id="status" class="status" role="status" aria-live="polite"></p></main>
<script>
const rows=[
{org:'GOV.UK',topic:'상태·접근성',title:'포커스에 노랑과 검정의 조합',fact:'GOV.UK는 링크 포커스에 노란 배경과 두꺼운 검정 아래 테두리를 사용한다고 설명합니다. 기능 색상표의 focus 값은 #ffdd00, focus-text는 #0b0c0c입니다.',limit:'이 조합은 GOV.UK 디자인 시스템에 한정됩니다. GOV.UK는 기능 색상의 고정 hex 복사 대신 용도별 govuk-functional-colour 토큰을 사용하도록 안내합니다. 다른 프로젝트에서는 자체 토큰과 배경별 대비·키보드 포커스를 검증해야 합니다.',url:'https://design-system.service.gov.uk/get-started/focus-states/',extra:'https://design-system.service.gov.uk/styles/colour/',visual:'focus',prompt:'키보드로 이동할 때 포커스된 링크가 분명히 보이도록 배경색과 아래 테두리를 함께 사용해줘. GOV.UK의 노란색 #ffdd00과 검정 #0b0c0c는 해당 시스템의 참고값으로만 표시해줘. GOV.UK 환경에서는 고정 hex 대신 govuk-functional-colour("focus")와 govuk-functional-colour("focus-text")를 쓰고, 다른 프로젝트에서는 자체 토큰과 배경에 맞는 대비를 검증해줘. 링크와 입력란의 포커스 형태는 각각 설계해줘.'},
{org:'GOV.UK',topic:'간격·레이아웃',title:'작은 화면과 큰 화면에서 달라지는 간격',fact:'GOV.UK 반응형 간격 단위 6은 작은 화면 20px, 640px을 초과하는 큰 화면 30px입니다. 단위 1은 두 경우 모두 5px입니다.',limit:'해당 시스템의 반응형 척도입니다. 모든 서비스에 5px 척도가 적합하다는 근거는 아닙니다.',url:'https://design-system.service.gov.uk/styles/spacing/',visual:'govspace',prompt:'화면의 내부 여백과 요소 간 간격을 토큰으로 관리해줘. GOV.UK의 단위 6처럼 작은 화면 20px, 큰 화면 30px으로 달라지는 예시를 참고하되, 우리 콘텐츠와 실제 화면 크기에 맞춰 검증해줘.'},
{org:'IBM Carbon v10',topic:'간격·레이아웃',title:'2·4·8·12·16px의 컴포넌트 간격 척도',fact:'Carbon v10의 컴포넌트 간격 척도에서 spacing-01~05는 각각 2, 4, 8, 12, 16px입니다.',limit:'Carbon v10 문서의 값이며 현재 버전이나 다른 디자인 시스템의 규칙으로 일반화하지 않습니다.',url:'https://v10.carbondesignsystem.com/guidelines/spacing/overview/',visual:'carbonspace',prompt:'컴포넌트 내부 여백과 항목 간 간격을 작은 단계로 일관되게 설계해줘. IBM Carbon v10의 2·4·8·12·16px 척도를 출발점으로 제안하고, 글자 크기와 화면 밀도에 맞춰 조정해줘.'},
{org:'Atlassian',topic:'타이포그래피',title:'본문 크기와 줄 높이를 함께 지정',fact:'Atlassian은 긴 글에 Body L, 컴포넌트의 짧은 글에 기본 Body M, 보조 정보에 Body S를 구분해 사용하며 작은 글자는 제한적으로 쓰라고 안내합니다.',limit:'이번에 확인한 공식 본문 텍스트에서 아래 세 쌍의 구체적인 글자 크기·줄 높이 값을 확인하지 못해 16/24, 14/20, 12/16px은 설명용 제안으로만 둡니다. 한국어와 글자 확대 환경에서 가독성을 확인해야 합니다.',url:'https://atlassian.design/foundations/typography/applying-typography',visual:'type',prompt:'긴 본문, 컴포넌트의 짧은 본문, 보조 정보의 용도를 구분하고 글자 크기와 줄 높이를 함께 설계해줘. 16/24, 14/20, 12/16px은 공식 확정값이 아닌 제안 예시이며 한국어와 확대 설정에서 실제 가독성을 검증해줘.'},
{org:'IBM Carbon',topic:'색상·역할',title:'색상을 배경·텍스트·경계선의 역할로 분리',fact:'Carbon은 색상 토큰을 배경, 레이어, 입력 영역, 경계선, 텍스트, 링크, 아이콘, 상태, 포커스 등의 역할로 구분합니다.',limit:'미리보기 색상은 역할을 설명하는 임의의 예시이며 Carbon의 공식 색상 값이 아닙니다.',url:'https://www.carbondesignsystem.com/building-blocks/foundations/color/overview',visual:'roles',prompt:'색상을 고정 색상명만으로 지정하지 말고 페이지 배경, 콘텐츠 레이어, 본문 텍스트, 링크, 테두리, 오류와 포커스처럼 역할별 토큰으로 정의해줘. 밝은 테마와 어두운 테마의 역할별 대비를 확인해줘.'},
{org:'Apple',topic:'색상·역할',title:'고정 색 대신 환경에 반응하는 의미 색상',fact:'Apple은 시스템 색상이 밝은 화면과 어두운 화면에 맞춰 바뀌며, 텍스트·구분선·배경 등 본래의 의미대로 사용하라고 설명합니다.',limit:'예시의 밝고 어두운 패널은 개념 설명이며 Apple 시스템 색상 값이 아닙니다. 실제 앱에서는 플랫폼의 동적 색상 API를 사용해야 합니다.',url:'https://developer.apple.com/design/human-interface-guidelines/color',visual:'apple',prompt:'iOS 화면의 배경·본문·보조 텍스트·구분선에 의미 기반 시스템 색상을 사용해줘. 라이트·다크 모드와 색상 대비 설정에서 확인하고, 색만으로 상태를 구분하지 말아줘.'},
{org:'Atlassian',topic:'모션',title:'작은 반응과 화면 전환의 서로 다른 시간',fact:'Atlassian의 모션 가이드는 상호작용 강조에 150ms, 중간 크기 진입에 250ms, 큰 페이지 전환에 400ms를 예시로 제시합니다.',limit:'아래 동작은 250ms를 표현한 새 개념도입니다. 실제 Atlassian 컴포넌트의 easing·움직임을 재현하거나 측정한 결과가 아닙니다.',url:'https://atlassian.design/foundations/motion/applying-motion',visual:'motion',prompt:'호버·눌림 같은 작은 반응과 모달·페이지 전환의 시간을 다르게 설계해줘. Atlassian의 150ms·250ms·400ms는 참고값으로 표시하고 시각적 무게, 빈도와 실제 기기 반응에 맞춰 조정해줘. 움직임 줄이기 설정에서 상태 변화는 유지해줘.'},
{org:'토스',topic:'컴포넌트·위계',title:'토스트의 큰 구조부터 세부 상태까지',fact:'토스는 토스트 가이드에서 상단과 하단 타입을 먼저 보여주고 각 요소와 상세 스펙을 설명합니다. 체크리스트에는 더 큰 텍스트와 다크모드가 포함됩니다.',limit:'시안의 색·텍스트·여백은 가상 예시입니다. 원문에 명시되지 않은 값은 토스의 실제 토큰으로 단정하지 않습니다.',url:'https://toss.tech/article/toss-design-system-guide',visual:'toss',prompt:'토스트 컴포넌트를 상단형과 하단형으로 나누어 예시를 보여줘. 각 타입의 메시지와 닫기 동작, 텍스트 확대와 다크모드에서의 상태를 함께 설계해줘. 실제 토큰 값은 확인 전 확정하지 말아줘.'},
{org:'Meta · Facebook',topic:'타이포그래피',title:'글자 확대를 위한 rem 단위',fact:'Meta는 2020년 Facebook.com 접근성 개선에서 개발 시 픽셀로 작성한 글자 크기를 빌드 과정에서 rem으로 변환해 사용자의 글자 크기 설정을 지원한다고 설명했습니다.',limit:'2020년 공개된 구현 설명입니다. 현재 Facebook의 실제 화면과 모든 요소의 크기 변환 여부는 확인하지 않았습니다.',url:'https://engineering.fb.com/2020/07/30/web/facebook-com-accessibility/',visual:'dynamic',prompt:'사용자의 브라우저 기본 글자 크기가 바뀔 때 본문과 UI 텍스트가 함께 확장되도록 상대 단위를 사용해줘. 확대 시 텍스트 잘림, 버튼 높이와 주변 레이아웃을 실제 화면에서 확인해줘.'},
{org:'Google · Material 3',topic:'타이포그래피',title:'역할로 나누는 다섯 가지 글자 계층',fact:'Material 3는 display, headline, title, body, label의 다섯 가지 역할을 구분하며 각각 large·medium·small 크기를 설명합니다.',limit:'역할과 크기 분류에 관한 원문 설명입니다. 시안의 서체와 수치는 임의 구성입니다.',url:'https://m3.material.io/styles/typography/applying-type',visual:'material',prompt:'화면 글자를 크기만으로 고르지 말고 display·headline·title·body·label 역할로 구분해줘. 제목은 정보의 계층을 드러내고 버튼의 글자는 label 역할로 설계해줘. 실제 서체와 크기는 프로젝트 맥락에 맞춰 정해줘.'},
{org:'IBM Carbon',topic:'컴포넌트·위계',title:'주요 버튼과 보조 행동의 시각적 우선순위',fact:'Carbon은 화면의 주요 행동에 primary 버튼을 쓰고 일반적으로 한 화면에 한 번 표시하도록 권고합니다. 일시적으로 별도 흐름이 열리는 경우는 예외로 설명합니다.',limit:'Carbon의 구성 원칙이며 모든 맥락에서 단 하나의 행동만 허용해야 한다는 뜻은 아닙니다. 시안 색상과 문구는 가상입니다.',url:'https://carbondesignsystem.com/components/button/usage/',visual:'buttons',prompt:'화면에서 가장 중요한 행동을 먼저 정하고 primary 버튼으로 강조해줘. 보조 동작은 시각적 비중을 낮추고, 별도 모달이나 패널이 열린 경우의 주요 행동도 맥락에 맞춰 설계해줘.'},
{org:'Apple',topic:'타이포그래피',title:'사용자 글자 크기에 맞춰 변하는 텍스트',fact:'Apple은 시스템 글꼴과 Dynamic Type의 텍스트 스타일이 사용자 설정에 따라 크기를 조정하도록 설명합니다.',limit:'미리보기는 크기 변화 개념도이며 iOS Dynamic Type을 실제로 구현하거나 검증한 것이 아닙니다.',url:'https://developer.apple.com/documentation/uikit/scaling-fonts-automatically',visual:'dynamic',prompt:'본문과 제목에 플랫폼의 텍스트 스타일을 적용해 사용자의 글자 크기 설정을 따르게 해줘. 확대할 때 글자가 잘리지 않고 버튼과 레이아웃이 재배치되는지 실제 기기에서 검증해줘.'}
];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function preview(v){if(v==='focus')return '<div class="gov-sample"><p>일반 링크</p><span class="focused">키보드 포커스 · 예시</span></div>';if(v==='govspace'||v==='carbonspace'){const a=v==='govspace'?[['작은 화면',20],['큰 화면',30]]:[['01',2],['02',4],['03',8],['04',12],['05',16]];return '<div class="spacings"><p class="small">막대 길이: 실제 간격의 4배로 확대</p>'+a.map(([l,n])=>`<div class="space-row"><span>${l}</span><span class="bar" style="width:${n*4}px"></span><span>${n}px</span></div>`).join('')+'</div>'}if(v==='type')return '<div class="type-sample"><p class="lg">본문 큰 글 · 16 / 24 제안</p><p class="md">기본 본문 · 14 / 20 제안</p><p class="sm">보조 글 · 12 / 16 제안</p></div>';if(v==='roles')return '<div class="colors"><div class="color-row"><span class="swatch" style="background:#fff"></span>페이지 배경</div><div class="color-row"><span class="swatch" style="background:#e6eaf2"></span>콘텐츠 레이어</div><div class="color-row"><span class="swatch" style="background:#244ca6"></span>링크</div><div class="color-row"><span class="swatch" style="background:#a82d3a"></span>오류</div></div>';if(v==='apple')return '<div style="display:flex;gap:8px;width:100%"><div style="padding:20px;background:#fff;color:#1d2430;flex:1">밝은 화면<br><small>본문 · 보조 글</small></div><div style="padding:20px;background:#222936;color:#fff;flex:1">어두운 화면<br><small>본문 · 보조 글</small></div></div>';if(v==='buttons')return '<div class="type-sample"><p>저장할 변경사항을 확인하세요</p><span style="display:inline-block;background:#144ed7;color:white;padding:10px 16px">변경사항 저장</span> <span style="display:inline-block;padding:10px 16px;border:1px solid #144ed7;color:#144ed7">취소</span></div>';if(v==='material')return '<div class="type-sample"><p style="font-size:24px">Display</p><p style="font-size:20px">Headline</p><p style="font-size:17px">Title</p><p style="font-size:14px">Body</p><p style="font-size:12px">Label</p></div>';if(v==='toss')return '<div class="type-sample"><p>상단 알림 · 예시</p><div style="padding:9px;background:#25304a;color:white">변경사항을 저장했어요</div><p style="margin-top:16px">하단 알림 · 예시</p><div style="padding:9px;background:#25304a;color:white">링크를 복사했어요</div></div>';if(v==='motion')return '<div class="motion-sample"><button type="button" data-play>250ms 예시 재생</button><div class="dot-track"><span></span></div></div>';return '<div class="type-sample"><p class="sm">일반 글자 크기</p><p class="lg">확대된 글자 크기</p><p>내용이 늘어나면 영역도 함께 확장</p></div>'}
const list=document.getElementById('list'),topic=document.getElementById('topic'),query=document.getElementById('query'),count=document.getElementById('count'),status=document.getElementById('status');
function render(){const q=query.value.toLowerCase().trim();const found=rows.map((x,i)=>({...x,i})).filter(x=>(!topic.value||x.topic===topic.value)&&[x.org,x.topic,x.title,x.fact,x.limit].join(' ').toLowerCase().includes(q));count.textContent=found.length+'건';list.innerHTML=found.map(x=>`<article class="entry"><div class="visual" aria-label="개념 시안">${preview(x.visual)}</div><div class="body"><div class="labels"><span class="pill">${esc(x.org)}</span><span class="pill">${esc(x.topic)}</span></div><h2>${esc(x.title)}</h2><p><strong>원문에서 확인</strong> ${esc(x.fact)}</p><p><strong>적용 조건</strong> ${esc(x.limit)}</p><details><summary>복사할 프롬프트 보기</summary><div class="prompt">${esc(x.prompt)}</div></details><div class="actions"><button type="button" data-copy="${x.i}">프롬프트 복사</button><a href="${esc(x.url)}">공식 원문 ↗</a>${x.extra?`<a href="${esc(x.extra)}">공식 값 ↗</a>`:''}</div></div></article>`).join('')||'<p>조건에 맞는 사례가 없습니다.</p>'}
topic.addEventListener('change',render);query.addEventListener('input',render);list.addEventListener('click',async e=>{const copy=e.target.closest('[data-copy]');if(copy){const text=rows[Number(copy.dataset.copy)].prompt;try{if(!navigator.clipboard||!window.isSecureContext)throw Error('no clipboard');await navigator.clipboard.writeText(text);status.textContent='프롬프트를 복사했습니다.'}catch{window.prompt('아래 지시문을 선택해 직접 복사해 주세요.',text)}return}const play=e.target.closest('[data-play]');if(play){const box=play.closest('.motion-sample');box.classList.remove('play');void box.offsetWidth;box.classList.add('play')}});render();
</script></body></html>
